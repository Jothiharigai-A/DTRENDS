<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D Trends – Custom Printed T-Shirts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#f1f2f7;--card:#fff;--ink:#16151d;--muted:#63627a;--line:#dcdde8;--accent:#4f46e5;--pop:#c6f432;--popink:#16151d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121a;--card:#1d1c28;--ink:#f1f0f8;--muted:#a3a2bb;--line:#33324a;--accent:#8b83ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13121a;--card:#1d1c28;--ink:#f1f0f8;--muted:#a3a2bb;--line:#33324a;--accent:#8b83ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
/* Bootstrap-style grid (inlined subset: container / row / col-*) */
.container{width:100%;max-width:1140px;margin:0 auto;padding:0 16px}
.row{display:flex;flex-wrap:wrap;margin:-8px}
.row>*{padding:8px;box-sizing:border-box}
.col-6{flex:0 0 50%;max-width:50%}
@media(min-width:768px){.col-md-4{flex:0 0 33.3333%;max-width:33.3333%}}
@media(min-width:1024px){.col-lg-3{flex:0 0 25%;max-width:25%}}
.btn-ink{background:var(--ink);color:var(--bg);border-radius:999px;padding:.7rem 1.4rem;font-weight:700;border:0;cursor:pointer}
.btn-pop{background:var(--pop);color:var(--popink);border-radius:999px;padding:.7rem 1.4rem;font-weight:800;border:0;cursor:pointer}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:.4rem 1rem;font-weight:600;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:100%}
.stage{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card))}
.logo{display:block;height:60px;width:auto;mix-blend-mode:multiply;transition:transform .25s}
.logo:hover{transform:rotate(-3deg) scale(1.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1);mix-blend-mode:screen}}
:root[data-theme="dark"] .logo{filter:invert(1);mix-blend-mode:screen}
@media(max-width:640px){.logo{height:48px}}
.hero-title{font-weight:800;letter-spacing:-.04em;line-height:.95}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes popin{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6)}60%{opacity:1;transform:scale(.92)}100%{transform:scale(1)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bump{50%{transform:scale(1.25)}}
.float{animation:floaty 6s ease-in-out infinite}
.pop{animation:popin .5s cubic-bezier(.2,.8,.2,1) both}
.modal-in{animation:slideup .4s cubic-bezier(.2,.8,.2,1) both}
.drawer-in{animation:slidein .35s cubic-bezier(.2,.8,.2,1) both}
.fade-in{animation:fade .25s both}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .45s cubic-bezier(.3,1.4,.5,1) both}
.toast{transform:translate(-50%,0);animation:toastin .35s both}
.bump{animation:bump .3s}
.shirt-body{transition:fill .45s ease}
.card{transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(20,18,40,.18)}
.card svg{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.card:hover svg{transform:rotate(-3deg) scale(1.06)}
.btn-ink,.btn-pop,.chip,.sw{transition:transform .15s,background .2s,color .2s}
.btn-ink:hover,.btn-pop:hover{transform:translateY(-2px)}
.btn-ink:active,.btn-pop:active,.chip:active{transform:scale(.95)}
.sw:hover{transform:scale(1.15)}
.marquee{overflow:hidden;white-space:nowrap;background:var(--ink);color:var(--bg)}
.marquee>div{display:inline-block;padding:.65rem 0;font-weight:800;animation:marquee 26s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useMemo, useEffect } = React;
const html = htm.bind(React.createElement);

const COLORS = [['White','#ffffff'],['Bone','#f5f5f4'],['Black','#111827'],['Navy','#1e3a8a'],['Forest','#166534'],['Teal','#0f766e'],['Purple','#4c1d95'],['Rust','#b45309'],['Orange','#ea580c'],['Pink','#fecdd3'],['Grey','#d1d5db']];
const INKS = ['#111827','#ffffff','#facc15','#0ea5e9','#be123c','#34d399','#f97316','#8b5cf6'];
const SIZES = ['S','M','L','XL','XXL'];
const ARTS = ['none','bolt','wave','sun','mountain','star','heart','cat','circle'];
const CATS = ['All','Graphic','Minimal','Typography','Outdoor'];
const POS = [['center','Center chest'],['left','Left chest'],['right','Right chest'],['back','Back']];
const POSNAME = Object.fromEntries(POS);

// 15 catalogue items
const PRODUCTS = [
 {id:1,name:'Bolt Rider',cat:'Graphic',price:24,color:'#111827',art:'bolt',ink:'#facc15',text:''},
 {id:2,name:'Ocean Drift',cat:'Graphic',price:26,color:'#f5f5f4',art:'wave',ink:'#0ea5e9',text:''},
 {id:3,name:'Solar Club',cat:'Graphic',price:25,color:'#1e3a8a',art:'sun',ink:'#facc15',text:'SOLAR CLUB'},
 {id:4,name:'Peak Hunter',cat:'Outdoor',price:27,color:'#166534',art:'mountain',ink:'#f5f5f4',text:'',pos:'right'},
 {id:5,name:'Night Star',cat:'Graphic',price:24,color:'#4c1d95',art:'star',ink:'#fde68a',text:''},
 {id:6,name:'Heart Beat',cat:'Graphic',price:23,color:'#fecdd3',art:'heart',ink:'#be123c',text:'',pos:'left'},
 {id:7,name:'Street Cat',cat:'Graphic',price:26,color:'#f5f5f4',art:'cat',ink:'#111827',text:'MEOW',pos:'back'},
 {id:8,name:'Plain White',cat:'Minimal',price:18,color:'#ffffff',art:'none',ink:'#111827',text:''},
 {id:9,name:'Plain Black',cat:'Minimal',price:18,color:'#111827',art:'none',ink:'#ffffff',text:''},
 {id:10,name:'Stay Wild',cat:'Typography',price:22,color:'#b45309',art:'none',ink:'#ffffff',text:'STAY WILD'},
 {id:11,name:'Good Vibes',cat:'Typography',price:22,color:'#0f766e',art:'none',ink:'#ffffff',text:'GOOD VIBES'},
 {id:12,name:'Your Name Tee',cat:'Typography',price:20,color:'#d1d5db',art:'none',ink:'#111827',text:'YOUR NAME'},
 {id:13,name:'Circle Mono',cat:'Minimal',price:21,color:'#f5f5f4',art:'circle',ink:'#111827',text:''},
 {id:14,name:'Night Summit',cat:'Outdoor',price:28,color:'#111827',art:'mountain',ink:'#34d399',text:'SUMMIT'},
 {id:15,name:'Sunset Wave',cat:'Outdoor',price:27,color:'#ea580c',art:'wave',ink:'#fff7ed',text:''}
];

function Art({art, ink}){
  const f = {fill:ink}, s = {stroke:ink, fill:'none', strokeWidth:7, strokeLinecap:'round', strokeLinejoin:'round'};
  switch(art){
    case 'bolt': return html`<polygon ...${f} points="165,95 120,165 148,165 136,215 185,140 156,140"/>`;
    case 'wave': return html`<path ...${s} d="M100 165 q16 -28 32 0 t32 0 t32 0"/>`;
    case 'sun': return html`<g ...${s} strokeWidth=${6}><circle cx="150" cy="150" r="22"/><path d="M150 108v-14M150 192v14M108 150H94M192 150h14M120 120l-10 -10M180 180l10 10M180 120l10 -10M120 180l-10 10"/></g>`;
    case 'mountain': return html`<g ...${f}><polygon points="95,205 140,130 168,175 188,148 215,205"/></g>`;
    case 'star': return html`<polygon ...${f} points="150,95 163,132 202,133 171,157 182,195 150,172 118,195 129,157 98,133 137,132"/>`;
    case 'heart': return html`<path ...${f} d="M150 205 C90 165 100 110 130 112 C142 113 148 120 150 128 C152 120 158 113 170 112 C200 110 210 165 150 205Z"/>`;
    case 'cat': return html`<g ...${f}><polygon points="108,105 128,128 108,150"/><polygon points="192,105 172,128 192,150"/><ellipse cx="150" cy="158" rx="46" ry="40"/></g><circle cx="135" cy="152" r="5" fill="#fff"/><circle cx="165" cy="152" r="5" fill="#fff"/>`;
    case 'circle': return html`<circle cx="150" cy="150" r="40" ...${s}/>`;
    default: return null;
  }
}

function Shirt({color, art, ink, text, className, pos='center', scale=1}){
  const label = (text||'').slice(0,14);
  const fs = label.length > 10 ? 14 : label.length > 7 ? 18 : 24;
  const tY = art === 'none' ? 160 : 240;
  const back = pos === 'back';
  const P = back ? [150,150,1.15] : pos === 'left' ? [118,98,.5] : pos === 'right' ? [182,98,.5] : [150,150,1];
  const tf = 'translate(' + P[0] + ' ' + P[1] + ') scale(' + (P[2] * scale) + ') translate(-150 -150)';
  return html`<svg viewBox="0 0 300 320" className=${className} role="img" aria-label=${'T-shirt in ' + color + (label ? ' printed ' + label : '')}>
    <path d="M105 20 Q150 52 195 20 L272 56 L246 112 L216 96 L216 300 L84 300 L84 96 L54 112 L28 56 Z" className="shirt-body" fill=${color} stroke="rgba(0,0,0,.28)" strokeWidth="2" strokeLinejoin="round"/>
    <path d=${back ? 'M105 20 Q150 30 195 20' : 'M105 20 Q150 52 195 20'} fill="none" stroke="rgba(0,0,0,.35)" strokeWidth="5"/>
    <path d="M216 96 L216 300 L84 300 L84 96" fill="none" stroke="rgba(0,0,0,.08)" strokeWidth="14"/>
    <g transform=${tf}><g className="stamp" key=${art + pos}><${Art} art=${art} ink=${ink}/>
    ${label && html`<text x="150" y=${tY} textAnchor="middle" fontFamily="Bricolage Grotesque, Arial, sans-serif" fontWeight="800" fontSize=${fs} fill=${ink} letterSpacing="1">${label}</text>`}
  </g></g></svg>`;
}

function Customizer({base, onClose, onAdd}){
  const [c, setC] = useState({color:base.color, art:base.art, ink:base.ink, text:base.text, size:'M', qty:1, pos:base.pos||'center', scale:1});
  const set = (k,v) => setC(p => ({...p,[k]:v}));
  const price = base.price + (c.text && c.text !== base.text ? 3 : 0);
  useEffect(() => { const k = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown',k); return () => window.removeEventListener('keydown',k); }, []);
  return html`<div className="fade-in fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-6" style=${{background:'rgba(10,9,20,.6)'}} onClick=${onClose}>
    <div role="dialog" aria-modal="true" aria-label=${'Customize ' + base.name} onClick=${e => e.stopPropagation()} className="modal-in w-full max-w-4xl max-h-full overflow-y-auto rounded-t-3xl md:rounded-3xl flex flex-col md:grid md:grid-cols-2" style=${{background:'var(--card)'}}>
      <div className="stage p-4 md:p-6 flex flex-col items-center justify-center sticky top-0 z-10 md:static"><${Shirt} ...${c} className="h-[30vh] w-auto md:h-auto md:w-full max-w-sm"/><p className="m-0 mt-1 text-sm font-semibold" style=${{color:'var(--muted)'}}>${c.pos === 'back' ? 'Back view' : 'Front view'} · ${POSNAME[c.pos]}</p></div>
      <div className="p-6 flex flex-col gap-4">
        <div className="flex justify-between items-start"><div><h2 className="text-2xl font-extrabold m-0">${base.name}</h2><p className="m-0" style=${{color:'var(--muted)'}}>Customize it, see it update live.</p></div>
          <button className="chip" onClick=${onClose} aria-label="Close customizer">Close</button></div>
        <div><p className="font-semibold mb-2">Shirt colour</p><div className="flex flex-wrap gap-2">${COLORS.map(([n,h]) => html`<button key=${h} className="sw" title=${n} aria-label=${n} aria-pressed=${c.color===h} style=${{background:h}} onClick=${() => set('color',h)}/>`)}</div></div>
        <div><p className="font-semibold mb-2">Graphic</p><div className="flex flex-wrap gap-2">${ARTS.map(a => html`<button key=${a} className="chip" aria-pressed=${c.art===a} onClick=${() => set('art',a)}>${a === 'none' ? 'No graphic' : a[0].toUpperCase()+a.slice(1)}</button>`)}</div></div>
        <div><p className="font-semibold mb-2">Print placement</p><div className="flex flex-wrap gap-2">${POS.map(([k,n]) => html`<button key=${k} className="chip" aria-pressed=${c.pos===k} onClick=${() => set('pos',k)}>${n}</button>`)}</div></div>
        <div><p className="font-semibold mb-2">Print size <span style=${{color:'var(--muted)',fontWeight:400}}>${Math.round(c.scale*100)}%</span></p><input type="range" min="0.6" max="1.4" step="0.05" value=${c.scale} onChange=${e => set('scale',+e.target.value)} aria-label="Print size" className="w-full" style=${{accentColor:'var(--accent)'}}/></div>
        <div><p className="font-semibold mb-2">Your text <span style=${{color:'var(--muted)',fontWeight:400}}>(max 14 characters, +$3)</span></p>
          <input value=${c.text} maxLength=${14} onChange=${e => set('text', e.target.value.toUpperCase())} placeholder="Type a name or slogan" className="w-full rounded-xl px-4 py-3" style=${{border:'1.5px solid var(--line)',background:'var(--bg)',color:'var(--ink)',font:'inherit'}}/></div>
        <div><p className="font-semibold mb-2">Print colour</p><div className="flex flex-wrap gap-2">${INKS.map(h => html`<button key=${h} className="sw" aria-label=${'Print colour ' + h} aria-pressed=${c.ink===h} style=${{background:h}} onClick=${() => set('ink',h)}/>`)}</div></div>
        <div><p className="font-semibold mb-2">Size</p><div className="flex flex-wrap gap-2">${SIZES.map(s => html`<button key=${s} className="chip" aria-pressed=${c.size===s} onClick=${() => set('size',s)}>${s}</button>`)}</div></div>
        <div className="flex items-center gap-3 mt-auto pt-2">
          <div className="flex items-center gap-2"><button className="chip" aria-label="Fewer" onClick=${() => set('qty',Math.max(1,c.qty-1))}>−</button><span className="w-6 text-center font-bold">${c.qty}</span><button className="chip" aria-label="More" onClick=${() => set('qty',Math.min(20,c.qty+1))}>+</button></div>
          <button className="btn-pop flex-1" onClick=${() => { onAdd({...c, name:base.name, price}); onClose(); }}>Add to cart · $${price * c.qty}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function CartDrawer({items, onClose, onChange, onRemove, onCheckout}){
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  return html`<div className="fade-in fixed inset-0 z-50" style=${{background:'rgba(10,9,20,.5)'}} onClick=${onClose}>
    <aside role="dialog" aria-label="Cart" onClick=${e => e.stopPropagation()} className="drawer-in absolute right-0 top-0 h-full w-full max-w-md flex flex-col" style=${{background:'var(--card)'}}>
      <div className="p-5 flex justify-between items-center" style=${{borderBottom:'1px solid var(--line)'}}><h2 className="m-0 text-xl font-extrabold">Your cart</h2><button className="chip" onClick=${onClose}>Close</button></div>
      <div className="flex-1 overflow-y-auto p-5 flex flex-col gap-4">
        ${items.length === 0 && html`<p style=${{color:'var(--muted)'}}>Your cart is empty. Pick a tee and make it yours.</p>`}
        ${items.map(i => html`<div key=${i.key} className="flex gap-3 items-center">
          <div className="stage rounded-xl w-20 h-20 shrink-0 p-1"><${Shirt} ...${i} className="w-full h-full"/></div>
          <div className="flex-1 min-w-0"><p className="m-0 font-bold truncate">${i.name}</p><p className="m-0 text-sm" style=${{color:'var(--muted)'}}>Size ${i.size} · ${POSNAME[i.pos||'center']}${i.text ? ' · "' + i.text + '"' : ''}</p>
            <div className="flex items-center gap-2 mt-1"><button className="chip" style=${{padding:'0 .6rem'}} aria-label="Fewer" onClick=${() => onChange(i.key,-1)}>−</button><span>${i.qty}</span><button className="chip" style=${{padding:'0 .6rem'}} aria-label="More" onClick=${() => onChange(i.key,1)}>+</button><button className="text-sm underline ml-2" style=${{color:'var(--muted)',background:'none',border:0,cursor:'pointer'}} onClick=${() => onRemove(i.key)}>Remove</button></div></div>
          <p className="m-0 font-bold">$${i.price * i.qty}</p></div>`)}
      </div>
      <div className="p-5" style=${{borderTop:'1px solid var(--line)'}}><div className="flex justify-between font-extrabold text-lg mb-3"><span>Total</span><span>$${total}</span></div>
        <button className="btn-ink w-full" disabled=${!items.length} onClick=${onCheckout} style=${{opacity: items.length ? 1 : .5}}>Check out</button></div>
    </aside></div>`;
}

function App(){
  const [cat, setCat] = useState('All');
  const [editing, setEditing] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState('');
  const [hero, setHero] = useState('#4c1d95');
  const [hp, setHp] = useState(0);
  useEffect(() => { const t = setInterval(() => setHp(h => (h + 1) % POS.length), 2600); return () => clearInterval(t); }, []);
  const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem('inkthread-cart')) || []; } catch(e) { return []; } });
  useEffect(() => { try { localStorage.setItem('inkthread-cart', JSON.stringify(cart)); } catch(e) {} }, [cart]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2600); return () => clearTimeout(t); }, [toast]);
  const list = useMemo(() => cat === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat), [cat]);
  const count = cart.reduce((s,i) => s + i.qty, 0);
  const add = item => {
    const key = [item.name,item.color,item.art,item.ink,item.text,item.size,item.pos,item.scale].join('|');
    setCart(c => c.find(x => x.key === key) ? c.map(x => x.key === key ? {...x, qty:x.qty + item.qty} : x) : [...c, {...item, key}]);
    setToast(item.name + ' added to cart');
  };
  const change = (k,d) => setCart(c => c.map(i => i.key === k ? {...i, qty:Math.max(1,i.qty + d)} : i));
  const remove = k => setCart(c => c.filter(i => i.key !== k));
  const heroSw = ['#4c1d95','#ea580c','#0f766e','#111827','#fecdd3'];

  return html`<div>

    <section id="top" className="container grid md:grid-cols-2 items-center gap-6 py-10 md:py-16">
      <div>
        <h1 className="hero-title text-4xl sm:text-5xl md:text-7xl m-0">Wear what you made.</h1>
        <p className="text-lg mt-5 mb-6 max-w-md" style=${{color:'var(--muted)'}}>Pick one of 15 ready designs or start from scratch. Choose colour, graphic and your own words, then see it on the shirt before you order.</p>
        <div className="flex flex-wrap gap-3 items-center">
          <a href="#shop" className="btn-pop no-underline">Browse the catalogue</a>
          <div className="flex gap-2 items-center" aria-label="Try a shirt colour">${heroSw.map(h => html`<button key=${h} className="sw" aria-label=${'Preview ' + h} aria-pressed=${hero===h} style=${{background:h}} onClick=${() => setHero(h)}/>`)}</div>
        </div>
      </div>
      <div className="stage rounded-3xl p-6"><${Shirt} color=${hero} art="bolt" ink=${hero === '#fecdd3' ? '#be123c' : '#facc15'} text="YOUR IDEA" pos=${POS[hp][0]} className="w-full max-w-md mx-auto float"/><p className="m-0 mt-3 text-center font-bold" style=${{color:'var(--muted)'}}>Print: ${POS[hp][1]}</p></div>
    </section>

    <div className="marquee mb-10" aria-hidden="true"><div>${Array(6).fill(' Center chest ✦ Left chest ✦ Right chest ✦ Full back print ✦ Your text, your colour ✦ ').join('')}</div></div>

    <section id="shop" className="container pb-12">
      <div className="flex flex-wrap items-end justify-between gap-3 mb-4">
        <h2 className="text-3xl font-extrabold m-0">The catalogue <span style=${{color:'var(--muted)',fontWeight:600}}>${list.length} tees</span></h2>
        <div className="flex flex-wrap gap-2" role="group" aria-label="Filter by category">${CATS.map(c => html`<button key=${c} className="chip" aria-pressed=${cat===c} onClick=${() => setCat(c)}>${c}</button>`)}</div>
      </div>
      <div className="row">
        ${list.map(p => html`<div key=${cat + p.id} className="col-6 col-md-4 col-lg-3 pop" style=${{animationDelay:(list.indexOf(p) * 45) + 'ms'}}>
          <article className="card flex flex-col">
            <div className="stage p-3"><${Shirt} ...${p} className="w-full"/></div>
            <div className="p-4 flex flex-col gap-2 flex-1">
              <div className="flex justify-between gap-2"><h3 className="m-0 text-lg font-bold">${p.name}</h3><span className="font-bold">$${p.price}</span></div>
              <p className="m-0 text-sm" style=${{color:'var(--muted)'}}>${p.cat} · ${POSNAME[p.pos||'center']}</p>
              <div className="flex gap-2 mt-auto pt-2">
                <button className="btn-ink flex-1" style=${{padding:'.55rem .5rem'}} onClick=${() => setEditing(p)}>Customize</button>
                <button className="chip" onClick=${() => add({...p, size:'M', qty:1})} aria-label=${'Quick add ' + p.name}>Add</button>
              </div>
            </div>
          </article></div>`)}
      </div>
    </section>

    <section id="how" className="container pb-14">
      <div className="card p-6 md:p-10 grid md:grid-cols-3 gap-6">
        <div><h3 className="font-extrabold text-xl mt-0">Choose a base</h3><p style=${{color:'var(--muted)'}}>Start with any design from the catalogue, or a plain tee.</p></div>
        <div><h3 className="font-extrabold text-xl mt-0">Make it yours</h3><p style=${{color:'var(--muted)'}}>Change the colour, swap the graphic, add up to 14 characters of text.</p></div>
        <div><h3 className="font-extrabold text-xl mt-0">We print and ship</h3><p style=${{color:'var(--muted)'}}>Each shirt is printed to order on soft combed cotton.</p></div>
      </div>
    </section>

    <footer className="container py-8 text-sm" style=${{color:'var(--muted)',borderTop:'1px solid var(--line)'}}>© 2026 D Trends. Demo store: checkout is a placeholder.</footer>

    ${editing && html`<${Customizer} base=${editing} onClose=${() => setEditing(null)} onAdd=${add}/>`}
    ${cartOpen && html`<${CartDrawer} items=${cart} onClose=${() => setCartOpen(false)} onChange=${change} onRemove=${remove} onCheckout=${() => { setCart([]); setCartOpen(false); setToast('Demo checkout complete. Thanks!'); }}/>`}
    ${toast && html`<div role="status" className="toast fixed left-1/2 bottom-6 z-50 px-5 py-3 rounded-full font-bold" style=${{background:'var(--ink)',color:'var(--bg)'}}>${toast}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
